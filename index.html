<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CSGO饰品市场崩盘模拟</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Microsoft YaHei', sans-serif;
}

body {
    background: linear-gradient(135deg, #1a2a3a, #0d1824);
    color: #e0e0e0;
    padding: 10px;
    min-height: 100vh;
    line-height: 1.5;
}

.container {
    width: 100%;
    margin: 0 auto;
    background: rgba(30, 40, 50, 0.8);
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    border: 1px solid #34495e;
}

header {
    text-align: center;
    margin-bottom: 15px;
    padding-bottom: 10px;
    border-bottom: 2px solid #3498db;
}

h1 {
    color: #3498db;
    font-size: 20px;
    margin-bottom: 8px;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
}

.subtitle {
    color: #95a5a6;
    font-size: 12px;
}

.game-area {
    background-color: #16213e;
    border-radius: 10px;
    padding: 15px;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    gap: 12px;
}

/* 统计面板：现金/持仓/总资产 */
.stats-panel {
    display: grid;
    grid-template-columns: repeat(3, 1fr); /* 始终3列 */
    gap: 4px; /* 极小间距 */
    margin-bottom: 10px;
}

/* 统一卡片基础样式（统计卡片+道具卡片） */
.stat-card, .item-card {
    background: rgba(40, 55, 70, 0.7);
    padding: 4px 2px; /* 极致缩小内边距，统一尺寸 */
    border-radius: 6px;
    text-align: center;
    box-shadow: 0 2px 3px rgba(0, 0, 0, 0.2);
    min-height: auto; /* 取消最小高度限制 */
    height: auto; /* 自适应高度 */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border: 2px solid transparent;
}

/* 统计卡片文字样式 */
.stat-card div:first-child {
    font-size: 10px; /* 描述文字 */
    color: #bbb;
    line-height: 1.2;
}

.stat-value {
    font-size: 12px; /* 数值文字 */
    font-weight: bold;
    color: #f1c40f;
    margin-top: 2px;
    line-height: 1.2;
}

/* 道具面板：强制2列布局（两两一排） */
.items-panel {
    display: grid;
    grid-template-columns: repeat(2, 1fr); /* 始终2列，两两一排 */
    gap: 4px; /* 和统计面板统一间距 */
    margin-bottom: 10px;
}

/* 道具卡片文字样式（和统计卡片完全统一） */
.item-name {
    font-size: 10px; /* 和统计卡片描述文字同尺寸 */
    font-weight: bold;
    color: #3498db;
    line-height: 1.2;
    margin-bottom: 2px;
}

.item-price {
    font-size: 12px; /* 和统计卡片数值同尺寸 */
    color: #f1c40f;
    line-height: 1.2;
    margin: 0;
}

.item-change {
    font-size: 9px; /* 涨跌幅更小，不超出卡片 */
    line-height: 1.2;
    margin-top: 2px;
}

/* 道具卡片选中样式 */
.item-card.active {
    border-color: #3498db;
    box-shadow: 0 0 8px rgba(52, 152, 219, 0.5);
}

.item-card:hover {
    transform: translateY(-1px); /* 缩小hover效果，适配小卡片 */
    cursor: pointer;
    transition: all 0.3s;
}

/* 涨跌幅颜色 */
.positive {
    color: #2ecc71;
}

.negative {
    color: #e74c3c;
}

.chart-container {
    height: 180px;
    margin-bottom: 10px;
    position: relative;
    background: rgba(25, 35, 45, 0.7);
    border-radius: 8px;
    padding: 10px;
}

.actions-panel {
    margin-bottom: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.trade-inputs {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
}

input, button {
    padding: 10px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
}

input {
    flex: 1;
    background: rgba(50, 65, 80, 0.8);
    color: white;
    min-height: 48px;
    border: 1px solid #34495e;
}

button {
    padding: 12px 20px;
    border-radius: 5px;
    color: white;
    cursor: pointer;
    transition: background-color 0.3s ease;
    min-height: 48px;
    display: flex;
    justify-content: center;
    align-items: center;
    flex: 1;
}

#buy-btn {
    background-color: #27ae60;
}

#buy-btn:hover {
    background: #219653;
}

.sell-btn {
    background: #e74c3c;
}

.sell-btn:hover {
    background: #c0392b;
}

.next-day-btn {
    background: #2ecc71;
    color: white;
    width: 100%;
    padding: 11px;
    font-size: 16px;
    margin-top: 5px;
}

.next-day-btn:hover {
    background: #27ae60;
}

button:disabled {
    background: #7f8c8d;
    cursor: not-allowed;
}

.history-panel {
    background: rgba(25, 35, 45, 0.7);
    border-radius: 8px;
    padding: 10px;
    max-height: 100px;
    overflow-y: auto;
}

.history-title {
    font-weight: bold;
    margin-bottom: 6px;
    color: #3498db;
    font-size: 14px;
}

.history-item {
    padding: 5px 0;
    border-bottom: 1px solid #34495e;
    font-size: 12px;
}

.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-content {
    background: #1a2a3a;
    width: 100%;
    max-width: 350px;
    position: relative;
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
    border: 2px solid #3498db;
    animation: popIn 0.3s ease-out;
}

@keyframes popIn {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}

.modal-header {
    color: #3498db;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
    text-align: center;
}

.modal-body {
    margin-bottom: 15px;
    line-height: 1.5;
    font-size: 14px;
}

.modal-footer {
    text-align: center;
}

.close-btn {
    background: #e74c3c;
    width: 100%;
    color: white;
}

.crash-effect {
    animation: pulse 0.5s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.5); opacity: 0.7; }
    100% { transform: scale(1); opacity: 1; }
}

.day-indicator {
    text-align: center;
    margin-bottom: 8px;
    font-size: 15px;
    color: #f1c40f;
}

/* 响应式优化：仅调整间距和字体，不改变列布局 */
@media (max-width: 768px) {
    .stats-panel {
        gap: 3px;
    }
    .items-panel {
        gap: 3px; /* 保持2列，仅缩小间距 */
    }
    .stat-card, .item-card {
        padding: 3px 1px;
    }
    .stat-card div:first-child, .item-name {
        font-size: 9px;
    }
    .stat-value, .item-price {
        font-size: 11px;
    }
    .item-change {
        font-size: 8px;
    }
    .trade-inputs {
        flex-direction: column; /* 交易按钮垂直排列，释放横向空间 */
    }
}

@media (max-width: 400px) {
    .container {
        padding: 8px;
    }
    .chart-container {
        height: 160px;
    }
    .modal-content {
        padding: 12px;
    }
    .history-panel {
        max-height: 90px;
    }
}
</style>
</head>
<body>
<div class="container">
    <header>
        <h1>CSGO饰品市场崩盘模拟</h1>
        <div class="subtitle">谨慎投资，市场有风险！</div>
    </header>
    
    <div class="day-indicator" id="day-indicator">第1天 - 10月15日</div>
    
    <div class="game-area">
        <!-- 统计面板：现金/持仓/总资产 -->
        <div class="stats-panel">
            <div class="stat-card">
                <div>现金</div>
                <div class="stat-value" id="cash-value">¥50,000</div>
            </div>
            <div class="stat-card">
                <div>持仓金额</div>
                <div class="stat-value" id="inventory-value">¥0</div>
            </div>
            <div class="stat-card">
                <div>总资产</div>
                <div class="stat-value" id="total-assets">¥50,000</div>
            </div>
        </div>
        
        <!-- 价格图表 -->
        <div class="chart-container">
            <canvas id="price-chart"></canvas>
        </div>
        
        <!-- 物品选择面板：2列布局（两两一排） -->
        <div class="items-panel">
            <div class="item-card active" data-item="butterfly">
                <div class="item-name">蝴蝶刀 | 多普勒</div>
                <div class="item-price">¥12,500</div>
                <div class="item-change positive">+0.00%</div>
            </div>
            <div class="item-card" data-item="gloves">
                <div class="item-name">运动手套 | 潘多拉</div>
                <div class="item-price">¥8,800</div>
                <div class="item-change positive">+0.00%</div>
            </div>
            <div class="item-card" data-item="dragon">
                <div class="item-name">龙狙 | 传说</div>
                <div class="item-price">¥35,000</div>
                <div class="item-change positive">+0.00%</div>
            </div>
            <div class="item-card" data-item="dagger">
                <div class="item-name">短剑 | 渐变之色</div>
                <div class="item-price">¥9,200</div>
                <div class="item-change positive">+0.00%</div>
            </div>
        </div>
        
        <!-- 操作面板 -->
        <div class="actions-panel">
            <div class="trade-inputs">
                <input type="number" id="trade-amount" placeholder="交易数量" min="1" value="1">
                <button id="buy-btn">买入</button>
                <button id="sell-btn" class="sell-btn">卖出</button>
            </div>
            <button id="next-day-btn" class="next-day-btn">下一天</button>
        </div>
        
        <!-- 交易记录 -->
        <div class="history-panel">
            <div class="history-title">交易记录</div>
            <div id="history-list" class="history-list"></div>
        </div>
    </div>
</div>

<!-- 事件弹窗 -->
<div class="modal" id="event-modal">
    <div class="modal-content">
        <div class="modal-header">市场事件</div>
        <div class="modal-body" id="event-content">
            初始事件：CSGO饰品市场今日开盘，整体价格稳定，专家预测短期不会有大幅波动。
        </div>
        <div class="modal-footer">
            <button class="close-btn" id="close-event">关闭</button>
        </div>
    </div>
</div>

<!-- 结果弹窗 -->
<div class="modal" id="result-modal">
    <div class="modal-content">
        <div class="modal-header">游戏结束</div>
        <div class="modal-body" id="result-content"></div>
        <div class="modal-footer">
            <button class="close-btn" id="restart-btn">重新开始</button>
        </div>
    </div>
</div>

<script>
// 游戏数据
const gameData = {
    currentDay: 1,
    cash: 50000,
    inventory: {
        butterfly: 0,
        gloves: 0,
        dragon: 0,
        dagger: 0
    },
    prices: {
        butterfly: [12500],
        gloves: [8800],
        dragon: [35000],
        dagger: [9200]
    },
    selectedItem: 'butterfly',
    events: [
        {day: 1, content: "初始事件：CSGO饰品市场今日开盘，整体价格稳定，专家预测短期不会有大幅波动。"},
        {day: 2, content: "V社发布公告：将在下周更新饰品交易机制，市场出现小幅震荡。"},
        {day: 3, content: "知名主播大量抛售库存，蝴蝶刀价格下跌15%！"},
        {day: 4, content: "某平台出现饰品被盗事件，手套类饰品价格下跌10%。"},
        {day: 5, content: "龙狙稀有度提升，价格暴涨20%！"},
        {day: 6, content: "市场恐慌性抛售，所有饰品价格集体下跌25%！"},
        {day: 7, content: "V社紧急澄清交易机制变更谣言，市场小幅回暖。"},
        {day: 8, content: "一周交易结束，最终结算！"}
    ],
    dayNames: [
        "10月15日", "10月16日", "10月17日", "10月18日", 
        "10月19日", "10月20日", "10月21日", "10月22日"
    ]
};

// 图表实例
let priceChart;

// DOM加载完成后初始化游戏
document.addEventListener('DOMContentLoaded', function() {
    initializeGame();
    setupEventListeners();
    drawPriceChart();
});

// 初始化游戏
function initializeGame() {
    updateUI();
    showEvent(1);
}

// 设置事件监听
function setupEventListeners() {
    // 物品选择
    document.querySelectorAll('.item-card').forEach(card => {
        card.addEventListener('click', function() {
            document.querySelectorAll('.item-card').forEach(c => c.classList.remove('active'));
            this.classList.add('active');
            gameData.selectedItem = this.dataset.item;
            drawPriceChart();
        });
    });

    // 买入按钮
    document.getElementById('buy-btn').addEventListener('click', function() {
        const amount = parseInt(document.getElementById('trade-amount').value) || 0;
        if (amount > 0) {
            buyItem(gameData.selectedItem, amount);
        }
    });

    // 卖出按钮
    document.getElementById('sell-btn').addEventListener('click', function() {
        const amount = parseInt(document.getElementById('trade-amount').value) || 0;
        if (amount > 0) {
            sellItem(gameData.selectedItem, amount);
        }
    });

    // 下一天按钮
    document.getElementById('next-day-btn').addEventListener('click', nextDay);

    // 关闭事件弹窗
    document.getElementById('close-event').addEventListener('click', function() {
        document.getElementById('event-modal').style.display = 'none';
    });

    // 重新开始按钮
    document.getElementById('restart-btn').addEventListener('click', function() {
        location.reload();
    });
}

// 买入物品
function buyItem(item, amount) {
    const currentPrice = gameData.prices[item][gameData.prices[item].length - 1];
    const totalCost = currentPrice * amount;
    
    if (totalCost > gameData.cash) {
        alert('现金不足！');
        return;
    }
    
    gameData.cash -= totalCost;
    gameData.inventory[item] += amount;
    
    addToHistory(`买入 ${amount} 件 ${getItemName(item)}，价格 ¥${currentPrice.toLocaleString()}`);
    updateUI();
}

// 卖出物品
function sellItem(item, amount) {
    if (gameData.inventory[item] < amount) {
        alert('持仓数量不足！');
        return;
    }
    
    const currentPrice = gameData.prices[item][gameData.prices[item].length - 1];
    const totalIncome = currentPrice * amount;
    
    gameData.cash += totalIncome;
    gameData.inventory[item] -= amount;
    
    addToHistory(`卖出 ${amount} 件 ${getItemName(item)}，价格 ¥${currentPrice.toLocaleString()}`);
    updateUI();
}

// 进入下一天
function nextDay() {
    if (gameData.currentDay >= 8) {
        endGame();
        return;
    }
    
    gameData.currentDay++;
    updatePrices();
    updateUI();
    showEvent(gameData.currentDay);
    
    // 崩盘特效
    if (gameData.currentDay === 6) {
        document.querySelector('.game-area').classList.add('crash-effect');
        setTimeout(() => {
            document.querySelector('.game-area').classList.remove('crash-effect');
        }, 2000);
    }
}

// 更新价格
function updatePrices() {
    const items = ['butterfly', 'gloves', 'dragon', 'dagger'];
    const volatility = [
        -0.15, 0.05, -0.05, 0.02,  // 第2天
        -0.15, -0.05, 0.10, -0.08, // 第3天
        -0.05, -0.10, 0.05, -0.05, // 第4天
        0.05, 0.03, 0.20, 0.08,    // 第5天
        -0.25, -0.25, -0.25, -0.25,// 第6天
        0.08, 0.05, 0.05, 0.06,    // 第7天
        0.02, 0.01, 0.03, 0.02     // 第8天
    ];
    
    items.forEach((item, index) => {
        const currentPrice = gameData.prices[item][gameData.prices[item].length - 1];
        const change = volatility[(gameData.currentDay - 2) * 4 + index];
        const newPrice = currentPrice * (1 + change);
        gameData.prices[item].push(Math.round(newPrice));
    });
}

// 显示事件
function showEvent(day) {
    const event = gameData.events.find(e => e.day === day);
    if (event) {
        document.getElementById('event-content').textContent = event.content;
        document.getElementById('event-modal').style.display = 'flex';
    }
}

// 结束游戏
function endGame() {
    const initialAssets = 50000;
    const finalAssets = calculateTotalAssets();
    const profit = finalAssets - initialAssets;
    let content = '';
    
    if (profit > 0) {
        content = `恭喜！你最终总资产为 ¥${finalAssets.toLocaleString()}，盈利 ¥${profit.toLocaleString()}！`;
    } else if (profit < 0) {
        content = `遗憾！你最终总资产为 ¥${finalAssets.toLocaleString()}，亏损 ¥${Math.abs(profit).toLocaleString()}！`;
    } else {
        content = `持平！你最终总资产为 ¥${finalAssets.toLocaleString()}，不亏不赚。`;
    }
    
    document.getElementById('result-content').textContent = content;
    document.getElementById('result-modal').style.display = 'flex';
}

// 更新UI
function updateUI() {
    // 更新当前天数
    document.getElementById('day-indicator').textContent = 
        `第${gameData.currentDay}天 - ${gameData.dayNames[gameData.currentDay - 1]}`;
    
    // 更新统计数据
    document.getElementById('cash-value').textContent = `¥${gameData.cash.toLocaleString()}`;
    
    const inventoryValue = calculateInventoryValue();
    document.getElementById('inventory-value').textContent = `¥${inventoryValue.toLocaleString()}`;
    
    const totalAssets = calculateTotalAssets();
    document.getElementById('total-assets').textContent = `¥${totalAssets.toLocaleString()}`;
    
    // 更新物品价格和涨跌幅
    document.querySelectorAll('.item-card').forEach(card => {
        const item = card.dataset.item;
        const prices = gameData.prices[item];
        const currentPrice = prices[prices.length - 1];
        const prevPrice = prices[prices.length - 2] || currentPrice;
        const change = ((currentPrice - prevPrice) / prevPrice * 100).toFixed(2);
        
        card.querySelector('.item-price').textContent = `¥${currentPrice.toLocaleString()}`;
        const changeEl = card.querySelector('.item-change');
        changeEl.textContent = `${change > 0 ? '+' : ''}${change}%`;
        
        if (change > 0) {
            changeEl.className = 'item-change positive';
        } else if (change < 0) {
            changeEl.className = 'item-change negative';
        } else {
            changeEl.className = 'item-change';
        }
    });
    
    // 更新按钮状态
    if (gameData.currentDay >= 8) {
        document.getElementById('next-day-btn').disabled = true;
        document.getElementById('next-day-btn').textContent = '查看结果';
    }
}

// 计算持仓价值
function calculateInventoryValue() {
    let value = 0;
    for (const item in gameData.inventory) {
        const count = gameData.inventory[item];
        const price = gameData.prices[item][gameData.prices[item].length - 1];
        value += count * price;
    }
    return value;
}

// 计算总资产
function calculateTotalAssets() {
    return gameData.cash + calculateInventoryValue();
}

// 添加交易记录
function addToHistory(text) {
    const historyList = document.getElementById('history-list');
    const historyItem = document.createElement('div');
    historyItem.className = 'history-item';
    historyItem.textContent = `[第${gameData.currentDay}天] ${text}`;
    historyList.appendChild(historyItem);
    historyList.scrollTop = historyList.scrollHeight;
}

// 获取物品名称
function getItemName(item) {
    const names = {
        butterfly: '蝴蝶刀 | 多普勒',
        gloves: '运动手套 | 潘多拉',
        dragon: '龙狙 | 传说',
        dagger: '短剑 | 渐变之色'
    };
    return names[item];
}

// 绘制价格图表
function drawPriceChart() {
    const ctx = document.getElementById('price-chart').getContext('2d');
    
    // 销毁旧图表
    if (priceChart) {
        priceChart.destroy();
    }
    
    const itemData = gameData.prices[gameData.selectedItem];
    const labels = Array.from({length: itemData.length}, (_, i) => `第${i+1}天`);
    
    priceChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: `${getItemName(gameData.selectedItem)}价格`,
                data: itemData,
                borderColor: '#3498db',
                backgroundColor: 'rgba(52, 152, 219, 0.1)',
                borderWidth: 2,
                fill: true,
                tension: 0.4,
                pointRadius: 3,
                pointHoverRadius: 5
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    display: false
                },
                tooltip: {
                    enabled: true,
                    titleFont: { size: 12 },
                    bodyFont: { size: 11 }
                }
            },
            scales: {
                x: {
                    grid: {
                        color: 'rgba(255, 255, 255, 0.05)',
                        display: false
                    },
                    ticks: {
                        color: '#e0e0e0',
                        font: { size: 10 }
                    }
                },
                y: {
                    grid: {
                        color: 'rgba(255, 255, 255, 0.05)'
                    },
                    ticks: {
                        color: '#e0e0e0',
                        font: { size: 10 },
                        callback: function(value) {
                            if (value >= 10000) {
                                return '¥' + (value / 10000).toFixed(1) + '万';
                            }
                            return '¥' + value.toLocaleString();
                        }
                    }
                }
            }
        }
    });
}
</script>
</body>
</html>
